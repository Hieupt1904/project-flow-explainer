# DSH bundle layer: mount the Project Flow Explainer adapter.
#
# The plugin is dependency-free: it never imports @deepseek-ai/* (a profile
# cannot resolve those), it only uses the Context object DSH hands to
# `apply(ctx, config)`.
#
# READ SCOPE - works on install: a session may read the directory DSH already
# confines it to, so the first diagram needs no configuration. `allowedRoots`
# only adds repositories OUTSIDE that directory, and it is empty by default.
#
#   - id: project-flow-explainer
#     config:
#       allowedRoots:
#         - /home/ban/workspace        # another repository, absolute path
#       includeSessionRoot: true       # false = only the roots above
#       pythonPath: python3
#       timeoutMs: 180000
#       maxOutputBytes: 1048576
#
# Config keys: includeSessionRoot, allowedRoots, pythonPath, coreRoot,
# timeoutMs, maxOutputBytes. Artifacts are always written to
# <repo>/artifacts/flows/<slug>/ - not configurable.
- insert:
    - id: project-flow-explainer
      name: dsh-project-flow-explainer
