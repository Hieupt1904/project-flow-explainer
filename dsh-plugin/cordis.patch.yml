# DSH bundle layer: mount the Project Flow Explainer adapter.
#
# The plugin is dependency-free: it never imports @deepseek-ai/* (a profile
# cannot resolve those), it only uses the Context object DSH hands to
# `apply(ctx, config)`.
#
# POLICY - deny-by-default: this row ships WITHOUT `allowedRoots`, so every
# tool call fails with `allowed_roots_unconfigured` until a profile supplies
# real roots. This file already inserts the row with id
# `project-flow-explainer`; a profile must OVERRIDE that id, never insert a
# second row with the same id:
#
#   - id: project-flow-explainer
#     config:
#       allowedRoots:
#         - /home/ban/workspace
#       pythonPath: python3
#       timeoutMs: 180000
#       maxOutputBytes: 1048576
#
# Config keys: allowedRoots (required to use any tool), pythonPath, coreRoot,
# timeoutMs, maxOutputBytes. Artifacts are always written to
# <repo>/artifacts/flows/<slug>/ - not configurable.
- insert:
    - id: project-flow-explainer
      name: dsh-project-flow-explainer
