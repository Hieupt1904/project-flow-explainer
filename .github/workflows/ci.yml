name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: py_compile
        run: python -m compileall -q scripts tests
      - name: unittest
        run: python -m unittest discover -s tests -v
      - name: knowledge schema is valid JSON
        run: python -c "import json; json.load(open('references/code-knowledge-schema.json'))"
      - name: repo policy (absolute paths, nested artifacts, secrets, manifest)
        run: python scripts/check_repo_policy.py

  adapter:
    name: adapter (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: |
          for file in dsh-plugin/index.js dsh-plugin/lib/*.js dsh-plugin/scripts/pack.mjs assets/viewer/*.js; do
            node --check "$file"
          done
      # Every adapter test file runs here. Running a subset let the lifecycle,
      # settings, argument and description contracts rot unnoticed: they existed
      # and passed locally while CI stayed green on three files.
      - name: adapter tests
        run: |
          node --test \
            dsh-plugin/tests/plugin.test.mjs \
            dsh-plugin/tests/knowledge.test.mjs \
            dsh-plugin/tests/lifecycle.test.mjs \
            dsh-plugin/tests/client.test.mjs \
            dsh-plugin/tests/settings.test.mjs \
            dsh-plugin/tests/arguments.test.mjs \
            dsh-plugin/tests/description.test.mjs \
            dsh-plugin/tests/command.test.mjs \
            dsh-plugin/tests/flow-filter.test.mjs \
            dsh-plugin/tests/skill.test.mjs \
            dsh-plugin/tests/catalog.test.mjs
      - name: viewer and Project Flow Explainer tests
        run: node --test tests/viewer-model.test.mjs tests/project-map-integration.test.mjs
      - name: pack + independent install
        run: node --test dsh-plugin/tests/pack.test.mjs

  manifest:
    name: bundle manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: required metadata
        run: |
          node -e '
            const m = require("./dsh-plugin/package.json");
            const need = ["name", "version", "type", "main", "exports", "files", "engines", "dsh"];
            for (const key of need) if (!(key in m)) { console.error("missing", key); process.exit(1) }
            if (!/^(0\.2\.[0-9]+-rc\.\d+|>=0\.2\.2-rc\.\d+ <0\.3\.0)$/.test(m.engines.dsh)) { console.error("engines.dsh must accept the 0.2.x line, got " + m.engines.dsh); process.exit(1) }
            if (!m.files.includes("vendor/core/scripts/build_flow.py")) { console.error("files missing core"); process.exit(1) }
            if (!m.files.includes("vendor/core/tools/pfe_cli.py")) { console.error("files missing cli"); process.exit(1) }
            if (!m.files.includes("vendor/core/pfe/")) { console.error("files missing knowledge package"); process.exit(1) }
            if (!m.dsh.bundle.patch) { console.error("dsh.bundle.patch missing"); process.exit(1) }
            console.log("manifest OK");
          '
      - name: patch file declares a single insert row
        run: |
          test "$(grep -c '^    - id: project-flow-explainer' dsh-plugin/cordis.patch.yml)" = "1"
          test "$(grep -c '^    - id:' dsh-plugin/cordis.patch.yml)" = "1"
      - name: pack dry run
        run: node dsh-plugin/scripts/pack.mjs
