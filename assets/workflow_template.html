<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="__VIEWER_CSP__">
  <title>Project Flow Explainer</title>
  <style>__VIEWER_CSS__</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span data-icon="flow"></span> Project Flow Explainer</div>
    <nav class="views" aria-label="Chế độ xem">
      <button type="button" id="view-technical" aria-pressed="true"><span data-icon="map"></span>Bản đồ</button>
      <button type="button" id="view-simple" aria-pressed="false"><span data-icon="list"></span>Từng bước</button>
    </nav>
    <div class="global-search">
      <span data-icon="search"></span>
      <label class="sr-only" for="search">Tìm bước, nhánh hoặc tệp</label>
      <input id="search" type="search" placeholder="Tìm bước, nhánh hoặc tệp…" autocomplete="off" aria-controls="search-results" aria-expanded="false">
      <kbd aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="top-actions">
      <button type="button" id="guide-start" title="Dẫn qua luồng" aria-label="Dẫn qua luồng"><span data-icon="compass"></span><span class="optional-label">Dẫn qua luồng</span></button>
      <button type="button" id="theme-toggle" title="Đổi giao diện" aria-label="Đổi giao diện"><span data-icon="theme"></span></button>
      <button type="button" id="download-flow" title="Tải bản đồ HTML" aria-label="Tải bản đồ HTML"><span data-icon="download"></span></button>
      <button type="button" id="panel-toggle" title="Ẩn hoặc hiện bảng chi tiết" aria-label="Ẩn hoặc hiện bảng chi tiết" aria-controls="inspector" aria-expanded="true"><span data-icon="panel"></span></button>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <section class="map-area" aria-labelledby="flow-title">
      <div class="flow-header">
        <div>
          <h1 id="flow-title">Sơ đồ quy trình</h1>
          <p id="flow-description"></p>
        </div>
        <p class="build-label" id="build-label">Xem ngoại tuyến</p>
      </div>
      <div id="viewport" tabindex="0" role="region" aria-label="Bản đồ kỹ thuật. Dùng phím mũi tên để di chuyển.">
        <div id="world"><svg id="edge-layer" aria-hidden="true"></svg><div id="nodes-layer"></div></div>
      </div>
      <section id="simple-view" aria-label="Danh sách từng bước" hidden></section>
      <div id="guide" class="guide" hidden aria-label="Dẫn qua luồng">
        <div class="guide-top"><p id="guide-position" role="status"></p><button type="button" id="guide-close" aria-label="Đóng hướng dẫn" title="Đóng hướng dẫn"><span data-icon="close"></span></button></div>
        <h2 id="guide-title"></h2>
        <p id="guide-summary"></p>
        <div id="guide-choices" class="guide-choices"></div>
        <button type="button" id="guide-back"><span data-icon="back"></span>Quay lại</button>
      </div>
      <div class="canvas-controls" id="canvas-controls">
        <div class="toolgroup" role="group" aria-label="Điều khiển bản đồ">
          <button type="button" id="zoom-out" aria-label="Thu nhỏ" title="Thu nhỏ"><span data-icon="minus"></span></button>
          <span id="zoom-level">100%</span>
          <button type="button" id="zoom-in" aria-label="Phóng to" title="Phóng to"><span data-icon="plus"></span></button>
          <button type="button" id="fit" title="Vừa khung"><span data-icon="fit"></span>Vừa khung</button>
        </div>
        <button type="button" id="minimap-toggle" class="minimap" aria-label="Định vị trong bản đồ" title="Chọn một vùng trên bản đồ thu nhỏ để di chuyển"><svg id="minimap" aria-hidden="true"></svg></button>
      </div>
    </section>
    <aside class="inspector" id="inspector" aria-label="Thông tin sơ đồ">
      <nav class="inspector-nav" aria-label="Thông tin sơ đồ">
        <button type="button" id="tab-overview" aria-pressed="true">Tổng quan</button>
        <button type="button" id="tab-details" aria-pressed="false">Chi tiết</button>
        <button type="button" id="tab-evidence" aria-pressed="false">Căn cứ</button>
      </nav>
      <div id="inspection-content" tabindex="-1"></div>
    </aside>
  </main>
  <div class="sr-only" id="announcement" role="status"></div>
  <noscript>Hãy bật JavaScript trong trình duyệt để xem sơ đồ.</noscript>
  <script id="workflow-json" type="application/json">__FLOW_JSON__</script>
  <script>__VIEWER_JS__</script>
</body>
</html>
